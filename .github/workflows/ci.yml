name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the floor declared in package.json engines — the first Node
        # with unflagged TypeScript stripping, which `npm test` needs to run
        # test/*.test.ts directly. Testing it keeps that claim honest rather
        # than aspirational; 24.x is where most users actually are.
        node: ['22.18.0', '24.x']
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Unit tests only. The integration suite shells out to a real `claude`
      # binary to assert against its debug output, which no runner has.
      - run: npm test
